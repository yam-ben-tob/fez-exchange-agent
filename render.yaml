services:
  - type: web
    name: fez-exchange-api
    runtime: python         # 'runtime' is the modern keyword for 'env'
    plan: free              # Explicitly stay on the free tier
    region: frankfurt       # Best for you in Israel
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: LLMOD_API_KEY
        sync: false
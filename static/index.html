<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Selection Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎓 University Selection Dashboard</h1>
    
    <div style="background: #f0f2f6; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <p>👈 Select a test profile or edit the JSON below, then click 'Run Analysis'!</p>
        
        <label for="profileSelect"><strong>Load a Pre-set Profile: </strong></label>
        <select id="profileSelect" onchange="loadProfile()" style="margin-bottom: 10px; padding: 5px;">
            <option value="default">Default Profile (CS, 3.2 GPA)</option>
            <option value="high_gpa">High GPA (Physics, 4.0)</option>
            <option value="low_gpa">Low GPA (Business, 2.0)</option>
            <option value="european_master">European Master (Medicine, 3.8)</option>
            <option value="english_only_freshman">English Only Freshman (Business, 2.5)</option>
        </select>

        <textarea id="promptInput"></textarea>
        
        <button id="runBtn" onclick="runAgent()">🚀 Run Analysis</button>
    </div>

    <div id="uiContainer"></div>

    <script src="profiles.js"></script>
    <script src="app.js"></script>

</body>
</html>
